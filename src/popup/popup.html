<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Batch Publisher</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="icons/icon48.png" alt="" class="logo">
    <div class="head-text">
      <h1>Batch Publisher</h1>
      <span class="small muted" id="version"></span>
    </div>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.77 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.55 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/>
      </svg>
    </button>
  </header>

  <main class="body">
    <div class="row-between">
      <span class="chip" id="connChip" data-state="busy">Checking page…</span>
      <button id="rescan" class="link-btn" type="button">Rescan</button>
    </div>

    <section class="card drafts-card">
      <div>
        <div class="drafts-count" id="draftCount">—</div>
        <div class="small muted">drafts found</div>
      </div>
      <div class="drafts-hint small muted" id="draftHint">Open YouTube Studio → Content.</div>
    </section>

    <section class="field">
      <label class="field-label">Publish as</label>
      <div class="segmented" role="radiogroup" aria-label="Visibility">
        <label><input type="radio" name="visibility" value="Public"><span>Public</span></label>
        <label><input type="radio" name="visibility" value="Unlisted" checked><span>Unlisted</span></label>
        <label><input type="radio" name="visibility" value="Private"><span>Private</span></label>
      </div>
    </section>

    <section class="card toggles">
      <label class="switch">
        <span class="label">Made for kids
          <small>Applies YouTube's "made for kids" answer</small>
        </span>
        <input type="checkbox" id="madeForKids"><span class="track"></span>
      </label>
      <label class="switch">
        <span class="label">Dry run
          <small>Preview only — changes nothing</small>
        </span>
        <input type="checkbox" id="dryRun"><span class="track"></span>
      </label>
    </section>

    <section class="actions">
      <button id="start" class="btn-primary" type="button">Publish drafts</button>
      <button id="stop" class="btn-danger hidden" type="button">Stop</button>
    </section>

    <section class="progress-wrap hidden" id="progressWrap">
      <div class="row-between small">
        <span id="progressLabel">Working…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress" role="progressbar" aria-labelledby="progressLabel" id="progressBar">
        <span id="progressFill"></span>
      </div>
    </section>

    <section class="log-wrap hidden" id="logWrap">
      <ul class="log" id="log" aria-live="polite"></ul>
    </section>

    <p class="banner hidden" id="banner" role="alert"></p>
  </main>

  <footer class="foot">
    <a href="https://github.com/pavnxet/YT-Video-Batch-Publisher" target="_blank" rel="noopener">Source</a>
    <span class="dot-sep">·</span>
    <a href="#" id="optionsLink">Settings</a>
    <span class="muted">v2.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
