name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build both browser targets
        run: npm run build

      - name: Validate the built manifests and bundles
        run: npm run validate

      - name: Run the test suite
        run: npm test

      - name: Upload unpacked builds
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-builds
          path: dist/
